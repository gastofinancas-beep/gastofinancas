    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // Suppress uncaught getter-only fetch errors in sandbox iframe
            window.addEventListener('error', function(e) {
              if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('only a getter') !== -1) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                return true;
              }
            }, true);

            // Allow window.fetch to be assigned without throwing "only a getter"
            var currentFetch = window.fetch;
            if (typeof currentFetch === 'function') {
              try {
                Object.defineProperty(window, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(fn) { currentFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              } catch (e1) {}
            }
          }
        } catch (err) {}
      })();
    </script>
