<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de logos</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;background:#f7f8fa}h1{font-size:18px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.c{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb}.c img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff}.n{font-size:12px;word-break:break-all}.ok{color:#059669;font-weight:700}.no{color:#dc2626;font-weight:700}</style></head><body>
<h1>Teste dos logos (API do Hunter)</h1><p id="r">Carregando...</p><div class="g" id="g"></div>
<script>
const domains=["amazon.com.br", "bluefit.com.br", "bumble.com", "capcut.com", "claro.com.br", "claude.ai", "cursor.com", "deezer.com", "disneyplus.com", "elevenlabs.io", "estadao.com.br", "folha.uol.com.br", "ge.globo.com", "globo.com", "globoplay.globo.com", "hulu.com", "looke.com.br", "max.com", "mercadolivre.com.br", "microsoft.com", "midjourney.com", "mistral.ai", "nubank.com.br", "nytimes.com", "peacocktv.com", "rappi.com.br", "recordplus.com", "runwayml.com", "sbtvideos.com.br", "smartfit.com.br", "surfshark.com", "telecine.com.br", "vivo.com.br", "wellhub.com", "xbox.com"];
const g=document.getElementById('g');let ok=0,bad=[];let done=0;
domains.forEach(d=>{const c=document.createElement('div');c.className='c';const i=new Image();i.src='https://logos.hunter.io/'+d;const t=document.createElement('div');t.className='n';t.textContent=d;c.append(i,t);g.append(c);
const fin=(good)=>{done++;t.insertAdjacentHTML('beforeend','<br><span class="'+(good?'ok':'no')+'">'+(good?'OK':'NÃO TEM')+'</span>');if(good)ok++;else bad.push(d);if(done===domains.length)document.getElementById('r').textContent=ok+' de '+domains.length+' com logo. Sem logo: '+(bad.join(', ')||'nenhum');};
i.onload=()=>fin(i.naturalWidth>1);i.onerror=()=>fin(false);});
</script></body></html>
